name: Release npm package
on:
  push:
    tags: ['npm-v*']
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: node scripts/check-release.mjs npm
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run release:pack
      - name: Publish verified tarball with npm OIDC
        run: npm publish .release/docusaurus/*.tgz --access public --provenance
